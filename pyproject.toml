[project]
name = "in-hand-rotation-mjlab"
version = "0.1.0"
description = "In-hand cube rotation task using LEAP hand in MuJoCo with mjlab"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mjlab==1.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.16.0",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "pyzmq>=25",
  "scipy",
]

[tool.uv]
package = true
# Resolve every dependency as it was on the HW1 release date (2026-08-27), the target of the Part 4 bonus.
exclude-newer = "2026-08-28T00:00:00Z"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }